[project]
name = "voicebench"
version = "0.1.0"
description = "Local test harness for a voice agent built on Together AI"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12",
    "openai>=1.40",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.12",
    "soundfile>=0.12",
    "jiwer>=3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
voicebench = "voicebench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["voicebench*"]
